name: Deploy to Cloudflare Workers

# Deploys main to the "gigflow" Worker. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   (Workers Scripts: Edit; Account Settings: Read)
#   CLOUDFLARE_ACCOUNT_ID
# and the runtime Supabase values as Worker secrets or vars (see docs/HOSTING.md).
# Until the secrets exist, the deploy step is skipped and the job still passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy with Wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json --name gigflow
      - name: Skipped (no Cloudflare secrets yet)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; build succeeded but nothing was deployed. See docs/HOSTING.md."
